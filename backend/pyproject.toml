[project]
name = "roomfit-backend"
version = "0.1.0"
requires-python = ">=3.12"
# fastapi and pydantic are pinned because backend/openapi.json (and a test on it) depends on
# the exact schema they generate; bump them together with `python -m scripts.dump_openapi`.
dependencies = ["fastapi==0.163.0", "pydantic==2.14.3", "uvicorn", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools]
packages = ["app"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
